<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工案款項追蹤系統</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#1c2733;--mute:#66768a;--line:#dfe5ec;--navy:#16273b;--ac:#2a5c8f;--ac2:#e9f0f7;--gold:var(--gold);--red:#b4382f;--grn:#1f7a4d;--row:#f6f9fc}
body[data-theme=forest]{--navy:#173a2f;--ac:#2f7d5b;--ac2:#e6f3ec;--bg:#edf3ee;--gold:#e3b64d;--row:#f3f9f5}
body[data-theme=sunset]{--navy:#4a2230;--ac:#c4552d;--ac2:#fbece5;--bg:#f8f0ea;--gold:#f4bb4a;--row:#fdf5f0}
body[data-theme=berry]{--navy:#33204f;--ac:#7b4bb0;--ac2:#f0e9f8;--bg:#f1eef7;--gold:#f2a7cc;--row:#f8f4fc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,var(--navy),color-mix(in srgb,var(--navy) 65%,var(--ac)));color:#cfd9e6;padding:0 20px;display:flex;gap:4px;align-items:stretch;flex-wrap:wrap;box-shadow:0 1px 0 #0c1827}
header h1{font-size:20px;font-weight:700;color:#fff;margin:0 22px 0 0;letter-spacing:.08em;display:flex;align-items:center;padding:12px 0}
header h1::before{content:"🏗️";margin-right:8px;font-size:23px}
header button{background:transparent;color:#a9b9cc;border:0;border-bottom:3px solid transparent;border-radius:0;padding:14px 14px 11px;font-size:16px}
header button:hover{color:#fff}
header button.on{color:#fff;border-bottom-color:var(--gold);font-weight:600}
header button.ghost{background:rgba(255,255,255,.08);color:#dbe5f0;border:1px solid rgba(255,255,255,.14);border-radius:5px;padding:5px 12px;margin:9px 0 9px 8px;font-size:15px}
header button.ghost:hover{background:rgba(255,255,255,.16)}
header select{width:auto;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.22);margin:9px 0 9px 8px;padding:4px 8px;font-size:15px;cursor:pointer}
header select option{color:#1c2733}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 22px;border-radius:26px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:16px}
#msg{align-self:center;font-size:15px;color:var(--gold)}
.sp{flex:1}
main{width:100%;padding:14px 20px 28px}
button{font:inherit;background:var(--ac);color:#fff;border:1px solid transparent;border-radius:8px;padding:6px 14px;cursor:pointer;transition:background .15s}
button:hover{filter:brightness(.88)}
button.ghost{background:#fff;color:var(--ac);border-color:#c6d4e3}
button.ghost:hover{background:var(--ac2)}
button.del{background:#fff;color:var(--red);border-color:#e6c6c3}
button.del:hover{background:#fbeeed}
button.sm{padding:2px 9px;font-size:15px}
input,select,textarea{font:inherit;width:100%;padding:6px 9px;border:1px solid #cdd7e2;border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(42,92,143,.15)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.c{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--ac);border-radius:12px;padding:10px 16px;transition:transform .15s}
.c:hover{transform:translateY(-3px)}
.c small{color:var(--mute);display:block;font-size:14.5px;margin-bottom:2px}
.c b{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.red{color:var(--red)}.grn{color:var(--grn)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 0 4px;margin-bottom:14px;overflow:hidden}
.panel h3{margin:0;padding:10px 14px;font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px;background:#f7f9fc;border-bottom:1px solid var(--line)}
.panel h3 small{font-size:14.5px;color:var(--mute);font-weight:400}
.panel>.info{padding:12px 14px}
/* 區塊邊框、陰影與分色 */
.panel,.c{border-color:#c5d0dc;box-shadow:0 1px 2px rgba(16,40,70,.08),0 3px 8px rgba(16,40,70,.05)}
.panel h3{border-bottom-color:#d3dce6}
.p-info{border-top:4px solid var(--navy)}
.p-inst{border-color:#8fb0d1;border-top:4px solid #2a5c8f}
.p-inst h3{background:#e4eef8;color:#1b4469;border-bottom-color:#b9d0e6}
.p-inst th{background:#f2f7fc}
.p-pay{border-color:#91c4a8;border-top:4px solid #1f7a4d}
.p-pay h3{background:#e2f2e9;color:#16583a;border-bottom-color:#b4dcc4}
.p-pay th{background:#f1f9f4}
.p-pay h3 button:not(.ghost):not(.del){background:#1f7a4d}
.p-pay h3 button:not(.ghost):not(.del):hover{background:#18623e}
/* 內容過寬或過長時，在框格內出現捲軸 */
.sc{overflow:auto;max-height:70vh}
.sc table{min-width:880px}
.sc table:has(#tb){min-width:1300px}
.p-inst .sc table{min-width:1050px}
th{position:sticky;top:0;z-index:1}
.tot td{font-weight:700;background:#eef2f7;border-top:2px solid #b7c4d3;position:sticky;bottom:0;z-index:1}
.p-inst .tot td{background:#e4eef8}.p-pay .tot td{background:#e2f2e9}
.charts{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.charts .panel h3 button+button{margin-left:6px}
.charts .panel h3{flex-wrap:wrap}
.dn{display:flex;align-items:center;gap:24px;padding:14px 18px;flex-wrap:wrap}
.lg{flex:1;min-width:220px;width:auto}
.lg i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:8px}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:7px 12px;border-bottom:1px solid #eaeff4;text-align:left;vertical-align:middle}
th{color:var(--mute);font-weight:600;font-size:14.5px;background:#fbfcfe;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td:last-child{white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover td{background:var(--row)}
.sub td{background:var(--ac2);font-size:15.5px}
.two{display:grid;gap:0 14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1500px){.two{grid-template-columns:1fr 1fr}}
.bar{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.filters{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.filters input{flex:2;min-width:220px}.filters select{flex:1;min-width:120px}
/* 資料區塊：依視窗寬度固定欄數，備註接在保單資訊右邊並延伸到最右 */
.info{--cols:2;--g:24px;display:flex;flex-wrap:wrap;gap:8px var(--g)}
@media(min-width:800px){.info{--cols:4}}
@media(min-width:1100px){.info{--cols:6}}
@media(min-width:1500px){.info{--cols:8}}
.info>div{flex:0 0 calc((100% - (var(--cols) - 1)*var(--g))/var(--cols) - .5px);min-width:0;white-space:pre-wrap;word-break:break-word}
.info>.rm{flex:1 1 calc((100% - (var(--cols) - 1)*var(--g))/var(--cols) - .5px)}
.info span{color:var(--mute);font-size:14.5px;display:block}
#modal{position:fixed;inset:0;background:rgba(16,28,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal .box{background:#fff;border-radius:8px;padding:22px 24px;width:min(760px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.box h3{margin:0 0 16px;font-size:21px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.box.fill{display:flex;flex-direction:column;height:min(92vh,900px);overflow:hidden}
.box.fill .grid{flex:0 1 auto;overflow:auto;min-height:0}
label.fx{display:flex;flex-direction:column;flex:1 1 auto;min-height:90px;margin-top:12px;font-size:14.5px;color:var(--mute);font-weight:500}
label.fx textarea{flex:1;resize:none;min-height:60px;margin-top:3px;color:var(--ink);font-size:16px}
.grid label{font-size:14.5px;color:var(--mute);font-weight:500}.grid label.w{grid-column:1/-1}
.grid input,.grid select,.grid textarea{margin-top:3px;color:var(--ink);font-size:16px}
[hidden]{display:none!important}
.tag{padding:1px 9px;border-radius:3px;background:var(--ac2);color:var(--ac);font-size:14px;font-weight:600}
.tag.ok{background:var(--grn);color:#fff}
.warn{background:#fdf6e3;border:1px solid #e8d49a;border-left:4px solid var(--gold);padding:8px 14px;border-radius:4px;margin-bottom:14px;font-size:15.5px}
@media(max-width:600px){.grid{grid-template-columns:1fr}header h1{width:100%}}
</style>
</head>
<body>
<header>
  <h1>工案款項追蹤</h1>
  <button id="t_o" onclick="go('o')">📊 總覽</button>
  <button id="t_l" onclick="go('l')">📋 工案列表</button>
  <button id="t_a" onclick="go('a')">🗄️ 結案封存</button>
  <button id="t_d" onclick="go('d')">💰 預收款統計</button>
  <span class="sp"></span>
  <span id="msg"></span>
  <select id="theme" onchange="setTheme(this.value)" title="切換主題"><option value="ocean">🌊 海洋</option><option value="forest">🌲 森林</option><option value="sunset">🌅 夕陽</option><option value="berry">🍇 莓果</option></select>
  <button class="ghost" onclick="exportXls()">匯出 Excel</button>
  <button class="ghost" onclick="setup()">連線設定</button>
</header>
<main id="v"></main>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s),n0=v=>Number(v)||0,f$=v=>n0(v).toLocaleString('zh-TW');
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CAT=['A','B','C','D'],CO=['何鑫實業','薪昌'],METH=['支票','網銀','現金'];
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today=()=>new Date().toLocaleDateString('sv');
let cfg={};try{cfg=JSON.parse(localStorage.getItem('cfg')||'{}')}catch(x){}
let D={Projects:[],Installments:[],Payments:[]},cur=null,tab='o',Q='',FC='',FO='',DF='',selCo=-1,CM='cat',PF='';

/* ---------- 資料層：有填網址就存 Google Sheet，否則存瀏覽器（僅供測試） ---------- */
async function call(o){
  if(!cfg.url){
    let db;try{db=JSON.parse(localStorage.getItem('db'))}catch(x){}
    db=db||{Projects:[],Installments:[],Payments:[]};
    if(o.action=='save'){const a=db[o.sheet],k=a.findIndex(x=>x.id==o.row.id);k<0?a.push(o.row):a[k]=o.row}
    if(o.action=='del'){
      if(o.sheet=='Projects'){db.Installments=db.Installments.filter(x=>x.pid!=o.id);db.Payments=db.Payments.filter(x=>x.pid!=o.id)}
      db[o.sheet]=db[o.sheet].filter(x=>x.id!=o.id)}
    localStorage.setItem('db',JSON.stringify(db));return db}
  const r=await fetch(cfg.url,{method:'POST',body:JSON.stringify({...o,key:cfg.key})});
  const j=await r.json();if(j.error)throw j.error;return j}
async function run(o){
  $('#msg').textContent='處理中…';
  try{D=await call(o)}catch(x){alert('操作失敗：'+x+'\n請檢查「連線設定」')}
  $('#msg').textContent='';show()}
const save=(sheet,row)=>run({action:'save',sheet,row});
const rm=(sheet,id)=>{if(!confirm('確定要刪除嗎？'+(sheet=='Projects'?'\n此工案的分期與收款紀錄也會一併刪除。':'')))return;if(sheet=='Projects')cur=null;run({action:'del',sheet,id})};

/* ---------- 計算 ---------- */
const insts=id=>D.Installments.filter(x=>x.pid==id),pays=id=>D.Payments.filter(x=>x.pid==id);
const stat=p=>{const r=pays(p.id).reduce((s,y)=>s+n0(y.amount),0);return{t:n0(p.gross),r,u:n0(p.gross)-r}};

/* ---------- 版面 ---------- */
function setTheme(t){document.body.dataset.theme=t;cfg={...cfg,theme:t};localStorage.setItem('cfg',JSON.stringify(cfg))}
function fireworks(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas'),d=devicePixelRatio||1,W=innerWidth,H=innerHeight;
  c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70';c.width=W*d;c.height=H*d;document.body.appendChild(c);
  const x=c.getContext('2d'),K=['#ff5a5f','#ffb400','#2ecc71','#3da5ff','#c77dff','#ffffff'];x.scale(d,d);
  let P=[],last=0;const t0=performance.now();
  const burst=()=>{const cx=W*(.15+Math.random()*.7),cy=H*(.15+Math.random()*.4),col=K[Math.random()*K.length|0];
    for(let i=0;i<80;i++){const a=Math.PI*2*i/80,v=2+Math.random()*4;P.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:Math.random()<.3?K[Math.random()*K.length|0]:col})}};
  (function f(now){
    if(now-t0<1800&&now-last>350){burst();last=now}
    x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.2)';x.fillRect(0,0,W,H);
    x.globalCompositeOperation='lighter';
    P=P.filter(p=>p.l>.02);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy=p.vy*.97+.06;p.l-=.012;x.globalAlpha=p.l;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,2.4,0,7);x.fill()});
    x.globalAlpha=1;
    now-t0<1800||P.length?requestAnimationFrame(f):c.remove()})(performance.now());
}
function printView(){
  let title,filt,head,body;
  if(tab=='d'){
    title='預收款統計（未稅）';filt=['接案公司：'+(DF||'全部')];
    head=['新增日期','類別','接案公司','工案名稱','客戶','未稅總額','已收（未稅）','未收（未稅）'];
    body=depData().map(x=>[x.p.date,x.p.cat,x.p.company,x.p.name,x.p.title,x.t,x.r,x.u])}
  else{
    const A=tab=='a';title=(A?'結案封存':'工案列表')+'（未稅）';
    filt=['案件類別：'+(FC?FC+' 類':'全部'),'接案公司：'+(FO||'全部')];if(Q.trim())filt.push('搜尋：'+Q.trim());
    head=[...(A?['結案日期']:[]),'新增日期','類別','接案公司','工案名稱','客戶','統編','未稅總額','已收（未稅）','未收（未稅）'];
    body=listData().map(p=>{const s=statNet(p);return[...(A?[p.closeDate]:[]),p.date,p.cat,p.company,p.name,p.title,p.taxid,s.t,s.r,s.u]})}
  const N=head.length-3,tot=[0,1,2].map(k=>body.reduce((t,r)=>t+n0(r[N+k]),0));
  const cell=(v,i)=>i>=N?`<td class="n">${f$(v)}</td>`:`<td>${e(v)}</td>`;
  const doc=`<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>${title}</title><style>
@page{size:A4 landscape;margin:12mm}
@media screen{body{padding:14px}}
body{font:12px/1.5 "Noto Sans TC","Microsoft JhengHei",sans-serif;color:#000;margin:0}
h1{font-size:20px;margin:0 0 4px}.meta{color:#444;margin-bottom:10px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #888;padding:4px 6px;text-align:left;vertical-align:top}
th{background:#e8edf3;-webkit-print-color-adjust:exact;print-color-adjust:exact}
thead{display:table-header-group}tfoot{display:table-row-group}tr{page-break-inside:avoid}
.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;background:#f1f4f8;-webkit-print-color-adjust:exact;print-color-adjust:exact}
</style></head><body><h1>${title}</h1><div class="meta">${filt.map(e).join('　｜　')}　｜　列印時間：${new Date().toLocaleString('zh-TW',{hour12:false})}</div>
<table><thead><tr>${head.map((h,i)=>`<th class="${i>=N?'n':''}">${h}</th>`).join('')}</tr></thead>
<tbody>${body.map(r=>`<tr>${r.map(cell).join('')}</tr>`).join('')||`<tr><td colspan="${head.length}">沒有資料</td></tr>`}</tbody>
<tfoot><tr><td colspan="${N}">合計（${body.length} 件）</td>${tot.map(v=>`<td class="n">${f$(v)}</td>`).join('')}</tr></tfoot></table></body></html>`;
  $('#modal').innerHTML=`<div class="box" style="width:min(1150px,100%)"><h3>🖨️ 列印預覽：${e(title)}</h3><iframe id="pv" style="width:100%;height:62vh;border:1px solid var(--line);border-radius:8px;background:#fff"></iframe><div class="bar"><button class="ghost" onclick="closeM()">取消</button><button onclick="doPrint()">列印</button></div></div>`;
  $('#modal').hidden=false;$('#pv').srcdoc=doc}
function doPrint(){const w=$('#pv').contentWindow;w.focus();w.print()}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
function go(t){tab=t;cur=null;show()}
function show(){
  ['o','l','a','d'].forEach(t=>$('#t_'+t).className=tab==t?'on':'');
  $('#v').innerHTML=(cfg.url?'':'<div class="warn">目前為「本機測試模式」，資料只存在這台瀏覽器。請按右上角「連線設定」填入 Google Apps Script 網址，才會存進 Google Sheet。</div>')+
    (cur?detail():{o:overview,l:list,a:list,d:deposit}[tab]());
  if(!cur&&(tab=='l'||tab=='a'))rows()}

function card(t,v,cls=''){const em=/未收/.test(t)?'⏳':/已收/.test(t)?'✅':/數|件/.test(t)?'🏗️':'💼';return`<div class="c big"><small>${em} ${t}</small><b class="${cls}">${f$(v)}</b></div>`}
const act=p=>`<td onclick="event.stopPropagation()"><label style="display:inline-flex;align-items:center;gap:5px;cursor:pointer;margin-right:6px"><input type="checkbox" style="width:auto" ${p.offset=='是'?'checked':''} onchange="toggleOff('${p.id}')">已收款已沖預收</label> <button class="sm" onclick="closeP('${p.id}')">結案</button></td>`;
const byId=id=>D.Projects.find(x=>x.id==id);
function toggleOff(id){const p=byId(id);save('Projects',{...p,offset:p.offset=='是'?'':'是'})}
function closeP(id){const p=byId(id);form('結案：'+e(p.name),[{k:'closeDate',l:'結案日期',t:'date',r:1}],{closeDate:today()},g=>save('Projects',{...p,closeDate:g.closeDate}).then(()=>{fireworks();toast('🎉 恭喜結案！')}))}
function reopen(id){confirm('要取消結案，並移回工案列表嗎？')&&save('Projects',{...byId(id),closeDate:''})}
const pickCo=i=>{selCo=selCo==i?-1:i;show()};

const COL=['var(--ac)','var(--gold)','#1f7a4d','#8a5a9b','#b4382f','#5b6b7c'];
function donut(it,ctr,sub){
  const T=it.reduce((s,x)=>s+x.v,0),L=String(ctr).length,fs=L>7?Math.max(12,22-(L-7)*2.2):22,R=70,C=2*Math.PI*R;let off=0;
  const seg=T?it.filter(x=>x.v>0).map(x=>{const l=x.v/T*C,h=`<circle r="${R}" cx="90" cy="90" fill="none" style="stroke:${x.c}" stroke-width="26" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"/>`;off+=l;return h}).join(''):'';
  return`<div class="dn"><svg viewBox="0 0 180 180" width="190" height="190" role="img"><circle r="${R}" cx="90" cy="90" fill="none" stroke="#e6ebf1" stroke-width="26"/>${seg}<text x="90" y="88" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#1c2733">${ctr}</text><text x="90" y="110" text-anchor="middle" font-size="12" fill="#66768a">${sub}</text></svg>

/* 未稅已收：直接取用款項分期中發票的未稅金額，同一張發票只算一次。
   1) 收款有選「對應發票」→ 用該發票未稅金額
   2) 沒選時，收款金額等於某張尚未對應的發票總額 → 自動對應，用該發票未稅金額
   3) 仍找不到 → 以「未稅總額 ÷ 含稅總額」比例換算 */
const statNet=p=>{
  const Y=pays(p.id),I=insts(p.id),n=n0(p.net),g=n0(p.gross),k=g?n/g:1,used=new Set();let r=0,loose=0;
  Y.forEach(y=>{const i=I.find(i=>i.id==y.iid);if(i)used.add(i.id)});
  Y.filter(y=>!I.some(i=>i.id==y.iid)).forEach(y=>{
    const i=I.find(i=>!used.has(i.id)&&n0(i.total)>0&&Math.abs(n0(i.total)-n0(y.amount))<1);
    if(i)used.add(i.id);else{loose++;r+=Math.round(n0(y.amount)*k)}});
  r+=I.filter(i=>used.has(i.id)).reduce((t,i)=>t+n0(i.net),0);
  return{t:n,r,u:n-r,loose}};
const depData=()=>D.Projects.filter(p=>!p.closeDate&&p.offset!='是'&&(!DF||p.company==DF)).map(p=>({p,...statNet(p)})).sort((x,y)=>y.p.date.localeCompare(x.p.date));
function deposit(){
  const a=depData();
  const t=a.reduce((s,x)=>s+x.t,0),r=a.reduce((s,x)=>s+x.r,0),L=a.reduce((s,x)=>s+x.loose,0);
  return`<div class="filters"><select style="max-width:260px" onchange="DF=this.value;show()"><option value="">全部接案公司</option>${CO.map(c=>`<option ${DF==c?'selected':''}>${e(c)}</option>`).join('')}</select><button class="ghost" onclick="printView()">🖨️ 列印</button></div>${L?`<div class="warn">有 ${L} 筆收款找不到對應的發票（未選「對應發票」，且收款金額也與任何一期分期的總額不符），暫以「未稅 ÷ 含稅」比例換算。請到該工案的收款紀錄選擇對應發票。</div>`:''}
  <div class="cards">${card('預收款工案數',a.length)}${card('已收金額（未稅，尚未沖預收）',r,'grn')}${card('未稅工案總額',t)}${card('未收金額（未稅）',t-r,'red')}</div>
  <div class="panel"><h3>預收款統計<small>尚未按「已收款已沖預收」的工案，金額皆為未稅</small></h3><div class="sc"><table><tr><th>新增日期</th><th>類別</th><th>接案公司</th><th>工案名稱</th><th>客戶</th><th class="n">未稅總額</th><th class="n">已收（未稅）</th><th class="n">未收（未稅）</th><th></th></tr>

function form(title,F,v,onSave,hook){
  const opt=o=>Array.isArray(o)?`<option value="${e(o[0])}">${e(o[1])}</option>`:`<option>${e(o)}</option>`;
  const fl=f=>`<label class="${f.w?'w':''}${f.fill?' fx':''}" data-k="${f.k}">${f.l}${f.r?' *':''}${f.t=='select'?`<select id="f_${f.k}">${f.o.map(opt).join('')}</select>`:f.t=='area'?`<textarea id="f_${f.k}" rows="2"></textarea>`:`<input id="f_${f.k}" type="${f.t||'text'}" ${f.t=='number'?'step="any"':''}>`}</label>`;
  $('#modal').innerHTML=`<div class="box${F.some(f=>f.fill)?' fill':''}"><h3>${title}</h3><div class="grid">${F.filter(f=>!f.fill).map(fl).join('')}</div>${F.filter(f=>f.fill).map(fl).join('')}
  <div class="bar"><button class="ghost" onclick="closeM()">取消</button><button id="ok">儲存</button></div></div>`;
  $('#modal').hidden=false;
  F.forEach(f=>$('#f_'+f.k).value=v[f.k]??'');
  const get=()=>Object.fromEntries(F.map(f=>[f.k,$('#f_'+f.k).value])),set=(k,x)=>$('#f_'+k).value=x;
  const upd=ev=>{if(ev&&hook)hook(get(),ev.target.id.slice(2),set);const g=get();F.forEach(f=>{if(f.s)$(`[data-k="${f.k}"]`).hidden=g[f.s[0]]!=f.s[1]})};
  $('#modal .grid').oninput=upd;$('#modal .grid').onchange=upd;upd();
  $('#ok').onclick=()=>{const g=get(),m=F.find(f=>f.r&&!g[f.k].trim());if(m)return alert('請填寫：'+m.l);closeM();onSave(g)}}

  const pn=id=>(D.Projects.find(p=>p.id==id)||{}).name||'',inv=id=>(D.Installments.find(i=>i.id==id)||{}).invNo||'';
  const wb=XLSX.utils.book_new(),add=(n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(a),n);
  add('工案總表',D.Projects.map(p=>{const s=stat(p);return{新增日期:p.date,接案日期:p.signDate||'',類別:p.cat,接案公司:p.company,工案名稱:p.name,客戶發票抬頭:p.title,統編:p.taxid,未稅總額:n0(p.net),含稅總額:s.t,已收總額:s.r,未收總額:s.u,'已收金額(未稅)':statNet(p).r,'未收金額(未稅)':statNet(p).u,已收合約正本:p.contract,開立本票:p.promissory,工程險保單:p.insurance,備註:p.remark,已收款已沖預收:p.offset=='是'?'是':'否',結案日期:p.closeDate||''}}));
  add('分期明細',D.Installments.map(i=>({工案名稱:pn(i.pid),款項進度:i.progress||'',發票日期:i.invDate,發票號碼:i.invNo,未稅金額:n0(i.net),稅額:n0(i.tax),總額:n0(i.total),傳票資訊:i.voucher,備註:i.remark||''})));
  add('收款紀錄',D.Payments.map(y=>({工案名稱:pn(y.pid),收款日期:y.date,付款方式:y.method,對應發票:inv(y.iid),支票資訊:y.check,銀行:y.bank,分行:y.branch,傳票號碼:y.voucher,收款金額:n0(y.amount),備註:y.remark||''})));
  const dep=D.Projects.filter(p=>!p.closeDate&&p.offset!='是').sort((x,y)=>y.date.localeCompare(x.date)).map(p=>{const s=statNet(p);return{新增日期:p.date,類別:p.cat,接案公司:p.company,工案名稱:p.name,客戶發票抬頭:p.title,未稅總額:s.t,'已收金額(未稅)':s.r,'未收金額(未稅)':s.u}});
  if(dep.length)dep.push({工案名稱:'合計',未稅總額:dep.reduce((t,x)=>t+x.未稅總額,0),'已收金額(未稅)':dep.reduce((t,x)=>t+x['已收金額(未稅)'],0),'未收金額(未稅)':dep.reduce((t,x)=>t+x['未收金額(未稅)'],0)});
  add('預收款統計',dep);
  XLSX.writeFile(wb,`工案款項_${today()}.xlsx`)}

(async()=>{document.body.dataset.theme=cfg.theme||'ocean';$('#theme').value=cfg.theme||'ocean';show();await run({action:'list'})})();
</script>
